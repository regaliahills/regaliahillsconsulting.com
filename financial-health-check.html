<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Financial Health Check | Regalia Hills Consulting</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow worksheet column on a cool wash; same paper, ink and review tick as the main site. Single light theme by choice. */
:root{
  --paper:#FFFFFF; --wash:#F1F4F7; --ink:#0F1E35; --body:#35425A; --muted:#647089; --rule:#D3D9E1;
  --tick:#1B7A55; --tick-wash:#E4F1EA; --mid:#A8771A; --low:#B4541A; --on-ink:#F3F6FA;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --text:"IBM Plex Sans","Segoe UI",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--wash);color:var(--body);font-family:var(--text);font-size:17px;line-height:1.55;margin:0}
h1,h2,h3,p,ul,fieldset,legend{margin:0;padding:0}
ul{list-style:none}
fieldset{border:0;min-width:0}
:focus-visible{outline:2px solid var(--tick);outline-offset:3px}
.top{background:var(--paper);border-bottom:1px solid var(--rule)}
.top .in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.in{max-width:800px;margin-inline:auto;padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo img{display:block;height:34px;width:auto}
.logo img.word{height:28px}
.top a.back{font-size:15px;color:var(--body)}
@media (max-width:520px){.logo img.word{display:none}}
main{padding-block:40px 64px}
.card{background:var(--paper);border:1px solid var(--rule);border-top:5px solid var(--ink);padding:40px;display:flex;flex-direction:column;gap:28px}
@media (max-width:600px){.card{padding:24px 20px}}
.label{font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--display);color:var(--ink);text-wrap:balance}
h1{font-size:clamp(32px,6vw,48px);line-height:1.05;font-weight:700;font-stretch:92%;letter-spacing:-.02em}
h2{font-size:clamp(24px,4vw,32px);line-height:1.12;font-weight:700}
h3{font-size:20px;line-height:1.25;font-weight:650}
.stack{display:flex;flex-direction:column;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--text);font-weight:600;font-size:16px;text-decoration:none;padding:13px 22px;border-radius:3px;border:1.5px solid var(--ink);background:var(--ink);color:var(--on-ink);cursor:pointer}
.btn:hover{background:#182B49}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--wash)}
.areas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 24px;font-size:16px;color:var(--ink)}
.areas li{display:flex;gap:10px;align-items:flex-start}
.tick{flex:none;width:18px;height:18px;color:var(--tick);margin-top:4px}
@media (max-width:560px){.areas{grid-template-columns:1fr}}
.meta{font-family:var(--mono);font-size:13px;color:var(--muted)}

.prog{display:flex;flex-direction:column;gap:8px}
.prog .row{display:flex;justify-content:space-between;gap:12px}
.track{height:4px;background:var(--rule)}
.track span{display:block;height:100%;background:var(--tick);transition:width .3s ease}
.q{display:flex;flex-direction:column;gap:10px}
.q legend{font-family:var(--display);font-weight:650;font-size:19px;line-height:1.3;color:var(--ink);margin-bottom:10px}
.opt{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;align-items:start;padding:11px 14px;border:1.5px solid var(--rule);border-radius:3px;cursor:pointer;font-size:16px;line-height:1.4;margin-bottom:8px}
.opt:hover{border-color:var(--muted)}
.opt input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--tick)}
.opt:has(input:checked){border-color:var(--tick);background:var(--tick-wash);color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1.5px solid var(--rule);border-radius:3px;padding:10px 12px;width:100%;min-width:0}
.field textarea{min-height:88px;resize:vertical}
.err{color:var(--low);font-size:15px;font-weight:500}
.nav{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--rule);padding-top:20px}
.small{font-size:14.5px;color:var(--muted)}

.scorebox{display:grid;grid-template-columns:184px minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:600px){.scorebox{grid-template-columns:1fr;justify-items:start}}
.ring{position:relative;width:184px;height:184px}
.ring .n{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .n b{font-family:var(--display);font-size:56px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.ring .n span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.dims{display:flex;flex-direction:column;gap:14px}
.dim .row{display:flex;justify-content:space-between;gap:12px;font-size:16px;color:var(--ink);font-weight:500}
.dim .row span:last-child{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;color:var(--body)}
.bar{height:8px;background:var(--wash);margin-top:6px}
.bar span{display:block;height:100%}
.focus{border-top:2px solid var(--ink)}
.focus > div{padding-block:18px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.cta{background:var(--ink);color:#A9B6C9;padding:28px;display:flex;flex-direction:column;gap:14px}
.cta h3{color:var(--on-ink);font-size:24px}
.cta .btn{background:var(--on-ink);color:var(--ink);border-color:var(--on-ink)}
.cta .btn.ghost{background:transparent;color:var(--on-ink)}
.cta .row{display:flex;flex-wrap:wrap;gap:12px}
.note{background:#FFF3D0;color:#6E4A00;border:1px dashed #D9A21B;border-radius:3px;padding:10px 14px;font-size:14px}
.foot{font-size:14px;color:var(--muted);text-align:center;padding-block:0 40px}
@media print{.top .back,.cta .row,.note{display:none}body{background:#fff}.card{border:0;padding:0}}

.logo img.mark{height:52px;width:auto}
.logo .sub{font-family:var(--text);font-size:13px;line-height:1.3;font-weight:500;letter-spacing:.01em;color:var(--body);border-left:1px solid var(--rule);padding-left:12px;text-align:left}
@media (max-width:560px){.logo .sub{display:none}}
</style>
</head>

<script>
"use strict";
(function(){
/* Results are posted to this Google Apps Script web app (the "Financial Health Check Regalia" project in John's Drive). */
var ENDPOINT_URL="https://script.google.com/macros/s/AKfycbyaU4ZHEXVXi5NLdtt__nKtQPNpa43X_jPB4MpwGJs-s-ITmkx0EJrcSIt0KQIArcqVxA/exec";
/* Only the real site sends results. Previews and local copies never post. */
var LIVE=/(^|\.)regaliahillsconsulting\.com$/.test(location.hostname);
var HOME="index.html", START="snapshot.html";

var DIMENSIONS=[
 {key:'books',name:'Books and close',desc:'The foundation everything else is built on.',
  insight:'Books that lag or go unreconciled mean every decision is made on stale numbers. We would start by getting your monthly close current, reconciled, and reviewed by a CPA.',
  questions:[
   {id:'q1',text:'How current are your books right now?',options:['Months behind, or not sure','A few weeks behind','Closed within about two weeks of month-end','Closed and reconciled within days, every month']},
   {id:'q2',text:'Who keeps your books?',options:['Me or a family member, in spare time','A part-time or in-house bookkeeper, lightly overseen','An outside bookkeeper or firm','A bookkeeper with CPA-level review each month']},
   {id:'q3',text:'Are your bank and credit card accounts reconciled every month?',options:['Rarely, never, or not sure','Sometimes, when we get to it','Most months','Every month, without fail']}]},
 {key:'visibility',name:'Financial visibility',desc:'Can you see what is happening in the business?',
  insight:'Without timely reporting you can trust, you end up running the business by bank balance. We would put a monthly dashboard in front of you with the few numbers that show how the business is doing.',
  questions:[
   {id:'q4',text:'How quickly can you get an accurate P&L for last month?',options:['I am not confident our P&L is accurate','It takes weeks and some chasing','Within a week or two','Anytime. It is current and I trust it']},
   {id:'q5',text:'Do you have a dashboard or report you look at regularly?',options:['No','Just the bank balance','A monthly P&L I review','A dashboard or KPIs I check regularly']},
   {id:'q6',text:'Do you know your gross margin, and whether it is trending up or down?',options:['No idea','Roughly, by gut','Yes, I can find it','Yes, and I track it over time']}]},
 {key:'jobCosting',name:'Profitability by job or service',desc:'Knowing which work makes money.',
  insight:'If you cannot see profit by job, service, or location, you cannot tell which work is worth chasing and which is losing money. We would set up the books and reporting to show it.',
  questions:[
   {id:'q7',text:'Can you see how much profit each job, project, or service line makes?',options:['No','Only roughly, after the fact','Yes, for most of them','Yes, in detail and close to real time']},
   {id:'q8',text:'Do you know which services, customers, or crews are your most profitable?',options:['No','I have a hunch','Mostly yes','Yes, with the numbers to back it up']},
   {id:'q9',text:'How do you price or bid new work?',options:['Gut feel, or matching competitors','Rough markup on materials and labor','A consistent costing method','Data from how past work performed']}]},
 {key:'cashFlow',name:'Cash flow and collections',desc:'How profitable businesses still get squeezed.',
  insight:'Cash surprises and slow collections squeeze businesses that are profitable on paper. A rolling cash forecast and tighter receivables fix most of it.',
  questions:[
   {id:'q10',text:'Do you know what your cash position will look like 4 to 8 weeks out?',options:['No. Cash is often a surprise','I keep a rough mental picture','I have a basic forecast','Yes, a rolling cash forecast I trust']},
   {id:'q11',text:'How are your collections and accounts receivable?',options:['Customers pay late and we do not track it well','We chase invoices reactively','We track receivables and follow up','Receivables aging is clean and actively managed']},
   {id:'q12',text:'In the last year, has a tax bill, payroll crunch, or cash shortfall caught you off guard?',options:['More than once','Once','A close call, but we managed','No. We saw it coming']}]},
 {key:'decision',name:'Decision readiness',desc:'Can your numbers help you grow, and let you step away?',
  insight:'When the numbers live only in your head, growth stalls and you can never step away. We would build the budget, forecasts, and advisory support so big decisions get easier.',
  questions:[
   {id:'q13',text:'Do you run against a budget or plan for the year?',options:['No','A loose target in my head','A simple budget','A budget we track actuals against']},
   {id:'q14',text:'For a big decision, such as a hire, a truck, or a new location, do you model the numbers first?',options:['No, I go on experience','A rough back-of-envelope','Some analysis','Yes, I run the numbers properly']},
   {id:'q15',text:'If you stepped away for a month, would anyone else understand the company\'s finances?',options:['No. It is all in my head','Sort of, the basics','Yes, a bookkeeper could','Yes, I have real financial support in place']}]},
 {key:'systems',name:'Systems and tools',desc:'How much of the back office still runs by hand.',
  insight:'Manual bill pay, invoicing, and data entry cost hours and cause errors. We would move those onto modern tools and let automation handle the repetitive work.',
  questions:[
   {id:'q16',text:'How do vendor bills get approved and paid?',options:['Paper checks and whatever is in my inbox','Online bank bill pay, entered by hand','A bill pay tool, with some manual steps','A bill pay tool with approvals that syncs to the books']},
   {id:'q17',text:'How do invoices go out and get collected?',options:['By hand, when someone gets to it','From our accounting software, with manual follow-up','Sent on a schedule, with payment links','Automated invoicing, reminders, and online payment']},
   {id:'q18',text:'How much of your bookkeeping is manual data entry?',options:['Almost all of it','A lot, with some bank feeds','Mostly bank feeds and rules','Automated end to end, with a person reviewing']}]}
];
var CONTEXT={
 industry:['Construction and trades','Professional services','Healthcare','Nonprofit','Retail or e-commerce','Manufacturing','Real estate','Other'],
 revenue:['Under $1M','$1M–$3M','$3M–$5M','$5M–$10M','$10M–$20M','Over $20M'],
 employees:['1–10','11–25','26–50','More than 50'],
 software:['QuickBooks Online','QuickBooks Desktop','Xero','Spreadsheets / manual','Other','Not sure'],
 payroll:['Run in-house','Outsourced (Gusto, ADP, etc.)','I handle it myself','We don’t run payroll']
};
var CLABEL={industry:'Industry',revenue:'Annual revenue',employees:'Employees',software:'Accounting software',payroll:'Payroll'};
var NQ=DIMENSIONS.reduce(function(a,d){return a+d.questions.length;},0);
var TOTAL=DIMENSIONS.length+2;
var state={step:-1,answers:{},context:{},contact:{}};
var card=document.getElementById('card');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var TK='<svg class="tick"><use href="#tk"/></svg>';

function welcome(){
  card.innerHTML='<div class="stack"><p class="label">Financial health check</p><h1>How healthy are your books and financials?</h1>'+
  '<p>'+NQ+' questions, about four minutes. You get a score out of 100, a score for each of six areas, and the two places we would start.</p></div>'+
  '<ul class="areas">'+DIMENSIONS.map(function(d){return '<li>'+TK+d.name+'</li>';}).join('')+'</ul>'+
  '<div class="stack"><div><button class="btn" type="button" id="go">Start the check</button></div><p class="meta">No cost · Results on screen and by email</p></div>';
  document.getElementById('go').addEventListener('click',function(){state.step=0;render();});
}
function head(title){
  var s=state.step;
  return '<div class="prog"><div class="row"><span class="label">Step '+(s+1)+' of '+TOTAL+'</span><span class="label">'+esc(title)+'</span></div><div class="track"><span style="width:'+Math.round((s+1)/TOTAL*100)+'%"></span></div></div>';
}
function nav(){
  return '<p class="err" id="err" hidden></p><div class="nav"><button class="btn ghost" type="button" id="back">Back</button><button class="btn" type="button" id="next">'+(state.step===TOTAL-1?'See my results':'Continue')+'</button></div>';
}
function render(){
  var s=state.step,h;
  if(s<0){welcome();return;}
  if(s<DIMENSIONS.length){
    var d=DIMENSIONS[s];
    h=head(d.name)+'<div class="stack"><h2>'+esc(d.name)+'</h2><p>'+esc(d.desc)+'</p></div>';
    d.questions.forEach(function(q){
      h+='<fieldset class="q"><legend>'+esc(q.text)+'</legend>';
      q.options.forEach(function(o,v){h+='<label class="opt"><input type="radio" name="'+q.id+'" id="'+q.id+'_'+v+'" value="'+v+'"'+(state.answers[q.id]===v?' checked':'')+'><span>'+esc(o)+'</span></label>';});
      h+='</fieldset>';
    });
  }else if(s===DIMENSIONS.length){
    h=head('About your business')+'<div class="stack"><h2>A little context</h2><p>This helps us read your results. We never share it.</p></div><div class="grid2">';
    Object.keys(CONTEXT).forEach(function(k){
      h+='<div class="field"><label for="c_'+k+'">'+CLABEL[k]+'</label><select id="c_'+k+'" data-ctx="'+k+'"><option value="">Select…</option>'+CONTEXT[k].map(function(v){return '<option'+(state.context[k]===v?' selected':'')+'>'+esc(v)+'</option>';}).join('')+'</select></div>';
    });
    h+='</div><div class="field"><label for="c_frustration">Your biggest finance frustration right now (optional)</label><textarea id="c_frustration" data-ctx="frustration" placeholder="For example: I never know if a job made money">'+esc(state.context.frustration)+'</textarea></div>';
  }else{
    var c=state.contact;
    h=head('Your results')+'<div class="stack"><h2>Where should we send your results?</h2><p>You will see them on the next screen, and we will email you a copy.</p></div>'+
    '<div class="grid2"><div class="field"><label for="k_name">Full name</label><input id="k_name" data-k="name" autocomplete="name" value="'+esc(c.name)+'"></div>'+
    '<div class="field"><label for="k_company">Company</label><input id="k_company" data-k="company" autocomplete="organization" value="'+esc(c.company)+'"></div>'+
    '<div class="field"><label for="k_email">Email</label><input id="k_email" data-k="email" type="email" autocomplete="email" value="'+esc(c.email)+'"></div>'+
    '<div class="field"><label for="k_phone">Phone (optional)</label><input id="k_phone" data-k="phone" type="tel" autocomplete="tel" value="'+esc(c.phone)+'"></div></div>'+
    '<p class="small">We may follow up to offer help. No spam, and we never share your information.</p>';
  }
  card.innerHTML=h+nav();
  document.getElementById('back').addEventListener('click',function(){state.step--;render();window.scrollTo(0,0);});
  document.getElementById('next').addEventListener('click',next);
  window.scrollTo(0,0);
}
card.addEventListener('change',function(e){var t=e.target;
  if(t.type==='radio'){state.answers[t.name]=Number(t.value);}
  else if(t.dataset.ctx){state.context[t.dataset.ctx]=t.value;}
  else if(t.dataset.k){state.contact[t.dataset.k]=t.value.trim();}});
card.addEventListener('input',function(e){var t=e.target;if(t.dataset.k){state.contact[t.dataset.k]=t.value.trim();}else if(t.dataset.ctx&&t.tagName==='TEXTAREA'){state.context.frustration=t.value;}});
function fail(m){var e=document.getElementById('err');e.textContent=m;e.hidden=false;}
function next(){
  var s=state.step;
  if(s<DIMENSIONS.length){if(!DIMENSIONS[s].questions.every(function(q){return state.answers[q.id]!==undefined;})){fail('Please answer every question to continue.');return;}}
  else if(s===DIMENSIONS.length){if(!Object.keys(CONTEXT).every(function(k){return state.context[k];})){fail('Please choose an answer for each of the five lists.');return;}}
  else{var c=state.contact;if(!(c.name&&c.company&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email||''))){fail('Please add your name, company, and a valid email.');return;}finish();return;}
  state.step++;render();
}
function scores(){
  var out={},sum=0;
  DIMENSIONS.forEach(function(d){var t=d.questions.reduce(function(a,q){return a+(state.answers[q.id]||0);},0);out[d.key]=Math.round(t/(d.questions.length*3)*100);sum+=out[d.key];});
  out.overall=Math.round(sum/DIMENSIONS.length);return out;
}
function internal(sc){
  var r=CONTEXT.revenue.indexOf(state.context.revenue),a=state.answers,cx=0;
  if((a.q1||0)<=1)cx+=2; if((a.q3||0)<=1)cx+=1;
  if(state.context.software==='Spreadsheets / manual')cx+=2;
  if(state.context.software==='QuickBooks Desktop')cx+=1;
  if(r>=3)cx+=1; if(state.context.employees==='More than 50')cx+=1;
  var needsAdvisory=sc.jobCosting<=40||sc.decision<=40, booksSolid=sc.books>=70&&(a.q2||0)>=2, tier;
  if(booksSolid&&(needsAdvisory||sc.visibility<=50))tier='Oversight and advisory';
  else if(r>=2&&needsAdvisory)tier='Full accounting department';
  else tier='Core accounting';
  return {opportunityScore:100-sc.overall,onboardingComplexity:cx>=5?'High':cx>=2?'Medium':'Low',suggestedTier:tier,fitFlag:(r>=1&&r<=4)?'In target revenue range':'Outside target revenue range'};
}
function band(n){
  if(n>=71)return {label:'Dialed in',color:'var(--tick)',tag:'Your finances are working as an asset.',intro:'You run a tight financial operation. Your books are current, you can see your numbers, and you decide with real data. The opportunity now is sharper forecasting, faster insight, and a business that does not depend on you to hold the numbers together.'};
  if(n>=41)return {label:'Building',color:'var(--mid)',tag:'The foundation is there. Visibility is the next step.',intro:'You have the basics handled, but there are gaps that cost you clarity and probably money. Many businesses at this stage are profitable without being able to see exactly why, or where. Closing the gaps below turns your books into something you run the business with.'};
  return {label:'Needs a foundation',color:'var(--low)',tag:'You are likely flying partly blind, and that is fixable.',intro:'Right now your numbers probably are not giving you the picture you need to run the business with confidence. That is common for growing businesses, and the fixes with the most impact are also the most direct. Here is where we would start.'};
}
function col(v){return v<40?'var(--low)':v<70?'var(--mid)':'var(--tick)';}
function finish(){
  var sc=scores(),b=band(sc.overall);
  var ranked=DIMENSIONS.map(function(d){return {d:d,v:sc[d.key]};}).sort(function(x,y){return x.v-y.v;});
  var focus=ranked.slice(0,2),best=ranked[ranked.length-1];
  var labels={};DIMENSIONS.forEach(function(d){d.questions.forEach(function(q){labels[q.id]={question:q.text,answer:q.options[state.answers[q.id]]};});});
  var payload={submittedAt:new Date().toISOString(),source:'Financial Health Check',
    contact:{name:state.contact.name||'',company:state.contact.company||'',email:state.contact.email||'',phone:state.contact.phone||''},
    context:{industry:state.context.industry||'',revenue:state.context.revenue||'',employees:state.context.employees||'',software:state.context.software||'',payroll:state.context.payroll||'',frustration:state.context.frustration||''},
    scores:sc,internal:internal(sc),answers:Object.assign({},state.answers),answerLabels:labels,
    result:{band:b.label,tag:b.tag,intro:b.intro,areas:DIMENSIONS.map(function(d){return {name:d.name,score:sc[d.key]};}),focus:focus.map(function(f){return {name:f.d.name,score:f.v,insight:f.d.insight};})}};
  var sent=false;
  if(LIVE){sent=true;try{fetch(ENDPOINT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).catch(function(){});}catch(e){}}
  var C=2*Math.PI*80,first=(state.contact.name||'').split(/\s+/)[0]||'there';
  var h='<div class="scorebox"><div class="ring"><svg viewBox="0 0 184 184" width="184" height="184" role="img" aria-label="Score '+sc.overall+' out of 100"><circle cx="92" cy="92" r="80" fill="none" stroke="#D3D9E1" stroke-width="11"/><circle cx="92" cy="92" r="80" fill="none" stroke="'+b.color+'" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-sc.overall/100)).toFixed(1)+'" transform="rotate(-90 92 92)"/></svg><div class="n"><b>'+sc.overall+'</b><span>out of 100</span></div></div>'+
    '<div class="stack"><p class="label">Your financial health check</p><h2>'+b.label+'</h2><p>'+b.tag+'</p></div></div>';
  if(!sent)h+='<p class="note">Preview mode: nothing was sent or emailed. Results are only submitted from regaliahillsconsulting.com.</p>';
  h+='<div class="stack"><p class="label">Where you stand, by area</p><div class="dims">'+DIMENSIONS.map(function(d){var v=sc[d.key];return '<div class="dim"><div class="row"><span>'+esc(d.name)+'</span><span>'+v+' / 100</span></div><div class="bar"><span style="width:'+v+'%;background:'+col(v)+'"></span></div></div>';}).join('')+'</div></div>';
  h+='<div class="stack"><p class="label">What this means</p><h3>Here is our read, '+esc(first)+'.</h3><p>'+b.intro+'</p>'+(best.v>=70?'<p>Your strongest area is '+esc(best.d.name.toLowerCase())+', at '+best.v+' out of 100.</p>':'')+'</div>';
  h+='<div class="stack"><p class="label">Where we would start</p><div class="focus">'+focus.map(function(f){return '<div><h3>'+esc(f.d.name)+' · '+f.v+' / 100</h3><p>'+esc(f.d.insight)+'</p></div>';}).join('')+'</div></div>';
  h+='<p class="small">This check is general information based on your answers, not accounting, tax, or legal advice for your situation.</p>';
  h+='<div class="cta"><h3>Want us to check the real numbers?</h3><p>This score is based on your answers. Our free discovery review looks at your actual books, and the written findings are yours to keep.</p><div class="row"><a class="btn" href="'+START+'">Start a free books review</a>'+(LIVE?'<button class="btn ghost" type="button" id="print">Save or print results</button>':'')+'</div></div>';
  card.innerHTML=h;
  var pb=document.getElementById('print');if(pb)pb.addEventListener('click',function(){window.print();});
  window.scrollTo(0,0);
}
render();
})();
</script>
